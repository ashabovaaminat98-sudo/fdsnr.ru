  <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ВНИМАНИЕ! КРИТИЧЕСКАЯ ОШИБКА SYSTEM</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle, #4a0000 0%, #000000 100%);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            text-shadow: 0 0 10px #ff0000;
        }
        .container {
            text-align: center;
            padding: 40px;
            border: 3px solid #ff0000;
            border-radius: 15px;
            background-color: rgba(0, 0, 0, 0.85);
            box-shadow: 0 0 30px #ff0000;
            max-width: 600px;
        }
        h1 {
            font-size: 26px;
            color: #ff3333;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #timer {
            font-size: 96px;
            font-weight: bold;
            color: #ff0000;
            margin: 20px 0;
            font-family: Arial, sans-serif;
            animation: pulse 1s infinite;
        }
        p {
            color: #ffcccc;
            font-size: 16px;
            line-height: 1.5;
        }
        .danger-btn {
            margin-top: 25px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            background-color: #ff0000;
            color: black;
            border: 2px solid #ffffff;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px #ff0000;
            transition: transform 0.1s;
        }
        .danger-btn:hover {
            background-color: #cc0000;
            color: white;
            transform: scale(1.05);
        }
        /* Стили для скрытой картинки-мема */
        #meme-img {
            display: none;
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
            border-radius: 10px;
            border: 2px solid #ffffff;
            box-shadow: 0 0 20px #ffffff;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container" id="box">
        <h1 id="title">Критическая угроза безопасности</h1>
        <p id="info">Если вы не нажмете эту кнопку, то удалятся все данные на вашем устройстве!</p>
        
        <div id="timer">15</div>
        
        <button class="danger-btn" id="actionBtn">ОТМЕНИТЬ УДАЛЕНИЕ</button>
        
        <!-- Ссылка на картинку-мем (можно заменить на свою) -->
        <img id="meme-img" src="https://postimg.cc" alt="Мем">
    </div>

    <script>
        let timeLeft = 15;
        const timerElement = document.getElementById('timer');
        const btn = document.getElementById('actionBtn');
        const memeImg = document.getElementById('meme-img');
        const boxTitle = document.getElementById('title');
        const boxInfo = document.getElementById('info');

        // Функция, которая убирает таймер и показывает мем
        function showMeme() {
            timerElement.style.display = 'none';
            btn.style.display = 'none';
            boxTitle.textContent = "ПОПАЛСЯ! 😂";
            boxTitle.style.color = "#00ff00";
            boxTitle.style.textShadow = "0 0 10px #00ff00";
            boxInfo.textContent = "Вас разыграли, никакие данные не удаляются!";
            memeImg.style.display = 'block'; // Показываем скрытую картинку
        }

        // Логика работы таймера
        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                showMeme();
            }
        }, 1000);

        // Клик по кнопке
        btn.addEventListener('click', () => {
            clearInterval(countdown);
            showMeme();
        });

        // Системное предупреждение при попытке уйти
        window.addEventListener('beforeunload', (event) => {
            event.preventDefault();
            event.returnValue = '';
        });
    </script>

</body>
</html>
